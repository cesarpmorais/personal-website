name: Deploy

# Hoje o site é publicado pela Vercel (a cada merge na main). Este workflow ficou só para o laboratório na VM da Oracle:
# rode na mão (Actions → Deploy → Run workflow) ou volte o gatilho `push` quando a VM existir.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cesarpmorais/personal-website

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      # x86 (VM.Standard.E2.1.Micro) e ARM (A1.Flex): a mesma imagem serve nas duas
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar o site na VM
        id: ssh
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
        run: |
          if [ -z "$VM_HOST" ]; then
            echo "VM_HOST não configurado: a imagem foi publicada, mas o deploy foi pulado."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # A chave do servidor fica fixa num secret: se alguém se passar pela VM, a conexão é recusada
          printf '%s\n' "$VM_HOST_KEY" > ~/.ssh/known_hosts
          # O comando que roda lá é o definido em authorized_keys (git pull + docker compose pull/up)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$VM_USER@$VM_HOST"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Conferir que o site respondeu
        if: steps.ssh.outputs.deployed == 'true'
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null -w "cesarpmorais.dev → HTTP %{http_code}\n" https://cesarpmorais.dev/
